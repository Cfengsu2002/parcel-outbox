[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-outbox"
version = "0.1.0"
description = "Transactional SQLite outbox with leased signed webhook delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
parcel-outbox = "parcel_outbox.cli:main"

[tool.setuptools]
packages = ["parcel_outbox"]
